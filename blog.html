<!--
  HOW TO ADD A NEW POST (no coding needed):
  1. Duplicate "post-template.html", rename the copy something like "post-2.html".
  2. Open the copy and replace the title, date, and paragraph text with your new writing.
  3. Come back to THIS file (blog.html) and copy one whole <a class="post-card">...</a>
     block below, paste it above the others, and update its title / date / excerpt / href
     to match your new post file.
  That's it — no build step, no extra accounts.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Minseo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #221C2B;
            --text-main: #EFE7E9;
            --text-muted: #A79AB0;
            --accent: #E7C9B8;
            --border: #362C3F;
            --glow: #C79B95;
            --font-display: 'Fraunces', serif;
            --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #F2ECEA;
                --text-main: #3A3244;
                --text-muted: #8B7F92;
                --accent: #A9695D;
                --border: #E3D6D2;
                --glow: #D9B6AC;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.65;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: absolute;
            top: -120px; left: 50%;
            width: 640px; height: 420px;
            transform: translateX(-50%);
            background: radial-gradient(closest-side, var(--glow), transparent 70%);
            opacity: 0.28;
            filter: blur(40px);
            pointer-events: none;
        }
        .container { max-width: 680px; margin: 0 auto; position: relative; }
        a.back {
            display: inline-block;
            margin-bottom: 40px;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-decoration: none;
            border-bottom: 1px solid var(--border);
        }
        a.back:hover { color: var(--accent); border-bottom-color: var(--accent); }
        h1 {
            font-family: var(--font-display);
            font-weight: 500;
            font-size: 2rem;
            margin-bottom: 40px;
        }
        .post-card {
            display: block;
            text-decoration: none;
            color: var(--text-main);
            padding: 22px 0;
            border-bottom: 1px solid var(--border);
            transition: opacity 0.2s ease;
        }
        .post-card:hover { opacity: 0.75; }
        .post-date {
            font-size: 0.82rem;
            color: var(--accent);
            font-style: italic;
            font-family: var(--font-display);
            margin-bottom: 6px;
        }
        .post-title {
            font-family: var(--font-display);
            font-weight: 500;
            font-size: 1.25rem;
            margin-bottom: 6px;
        }
        .post-excerpt {
            font-size: 0.92rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="index.html">&larr; Back to portfolio</a>
    <h1>Notes &amp; Research</h1>

    <!-- Duplicate the block below for each new post -->
    <a class="post-card" href="post-template.html">
        <div class="post-date">Month Day, Year</div>
        <div class="post-title">Your post title goes here</div>
        <div class="post-excerpt">A one or two sentence teaser of what the post covers, so visitors know if it's what they're looking for.</div>
    </a>

</div>
</body>
</html>
